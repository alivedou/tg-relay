name: Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签（留空自动生成 1.0.x 递增，例如 1.0.2 → 1.0.3）'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 生成版本标签
        id: version
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "来源: 手动输入"
          else
            PKG_NAME="${{ github.event.repository.name }}"
            OWNER="${{ github.repository_owner }}"
            TAGS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/container/$PKG_NAME/versions?per_page=100" \
              | jq -r '.[].metadata.container.tags[]?' 2>/dev/null)
            MAX=$(echo "$TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$MAX" ]; then
              NEXT="1.0.1"
            else
              MAJOR=$(echo "$MAX" | cut -d. -f1)
              MINOR=$(echo "$MAX" | cut -d. -f2)
              PATCH=$(echo "$MAX" | cut -d. -f3)
              NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
            echo "来源: 自动递增（现有最高 $MAX → $NEXT）"
          fi

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
